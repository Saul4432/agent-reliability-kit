[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-kit"
version = "0.1.0"
description = "Observability, planted-failure evals and CI quality gates for LLM agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Saúl Gimeno", email = "gimenosaul@gmail.com" }]
keywords = ["llm", "agents", "evals", "observability", "tracing", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.15.11",
    "mypy==1.20.2",
    "types-PyYAML",
]

[project.entry-points.pytest11]
relkit = "relkit.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/relkit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C90", "RUF"]
mccabe.max-complexity = 12

[tool.mypy]
strict = true
files = ["src/relkit"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/relkit"]

[tool.coverage.report]
fail_under = 90
show_missing = true
